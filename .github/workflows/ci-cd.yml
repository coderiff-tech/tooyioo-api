name: Tests

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: Find aggregated report
        if: always()
        run: |
          echo "Looking for TUnit reports..."
          find "$RUNNER_TEMP" -type f \( -name "merged-report.html" -o -name "*.tunit-report.json" \) -print

      - name: Prepare GitHub Pages
        if: always()
        run: |
          mkdir -p ./pages
          cp "$RUNNER_TEMP"/tunit-aggregate/**/merged-report.html ./pages/index.html

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages

  deploy:
    name: Publish test report
    needs: test
    if: always()
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5