<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooyioo Test Reports</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
        }

        h1 {
            margin-bottom: 5px;
        }

        .latest {
            padding: 20px;
            margin: 30px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .passed {
            color: #16803c;
            font-weight: 600;
        }

        .failed {
            color: #d1242f;
            font-weight: 600;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>
    <h1>Tooyioo Test Reports</h1>

    <p>
        TUnit test history for <strong>main</strong>.
    </p>

    <div class="latest">
        <h2>Latest</h2>

        <p>
            <a href="latest/">
                Open latest TUnit report →
            </a>
        </p>
    </div>

    <h2>History</h2>

    <table>
        <thead>
            <tr>
                <th>Run</th>
                <th>Date</th>
                <th>Status</th>
                <th>Commit</th>
                <th>Report</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
<tr><td>3</td><td>2026-09-13 20:02:21 UTC</td><td class="passed">PASSED</td><td><code>581c008</code></td><td><a href="runs/34779436016/">TUnit report</a></td><td><a href="https://github.com/coderiff-tech/tooyioo-api/actions/runs/34779436016">GitHub Actions</a></td></tr>
<tr><td>2</td><td>2026-09-13 18:53:47 UTC</td><td class="passed">PASSED</td><td><code>fa8d9c1</code></td><td><a href="runs/34775959037/">TUnit report</a></td><td><a href="https://github.com/coderiff-tech/tooyioo-api/actions/runs/34775959037">GitHub Actions</a></td></tr>
        </tbody>
    </table>

</body>
</html>
